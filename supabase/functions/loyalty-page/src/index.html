<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I tuoi punti Mimì · Amimì</title>
<!--
  Area Membri Amimi' - PRODUZIONE (dati REALI via App Proxy). Pagina nuova dal 2026-10-11 (call del 09-10):
  solo punti Mimi' (niente livelli, niente timbri), percorso con le bandierine a scacchi, elenco di tutti i codici
  riscattati, memory con le foto vere delle borse, presenza agli eventi dal QR (?evento=CODICE).
  Va servita SAME-ORIGIN su amimi.it, cosi' le fetch a /apps/premia/* portano il logged_in_customer_id firmato da
  Shopify (nessun secondo login). Servita da un altro dominio NON funziona: il cookie di login e' su amimi.it.
  Contratto edge loyalty-proxy v14: state | coccola | memory_win | rewards | redeem | profile | profile_save | track | deck | checkin.
  Il costo e il valore del premio arrivano dal server (riga attiva di loyalty_rewards): qui nessun numero fisso.
  La Mimi' e' src/mimi.webp: build.mjs la inserisce al posto del segnaposto nella costante MIMI (una sola occorrenza).
  Tema: solo chiaro, per scelta (il negozio non ha un tema scuro e la Mimi' ha il bordo bianco da adesivo).
  Forme: bottoni a pillola, card 20px, righe e campi 14px. Un solo colore d'accento: il rosso della Mimi'.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#E10A0A; --red-deep:#A30008; --pink:#F9CBD0; --pink-soft:#FDECEE; --paper:#FFFBFB;
    --ink:#2B1215; --muted:#7E5158; --line:#F3BFC6; --white:#FFFFFF;
    --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    --body:"Work Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --ease:cubic-bezier(.3,.8,.3,1);
    --chk:conic-gradient(var(--red) 90deg,var(--white) 90deg 180deg,var(--red) 180deg 270deg,var(--white) 270deg);
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--pink-soft);font-family:var(--body);font-size:15px;line-height:1.45;color:var(--ink);max-width:480px;margin:0 auto;padding:18px 16px 56px;min-height:100dvh;position:relative;overflow-x:hidden}
  button{font:inherit;color:inherit}
  a{color:var(--red-deep)}
  :focus-visible{outline:2.5px solid var(--red-deep);outline-offset:2px}
  .hidden{display:none!important}
  .tap{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
  .tap:active{transform:scale(.98)}
  .logo{display:block;width:max-content;margin:0 auto;font-family:var(--display);font-style:italic;font-weight:600;font-size:26px;line-height:1.2;color:var(--red-deep);text-decoration:none;letter-spacing:.5px}
  h2{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.1;margin-bottom:12px}
  main{display:flex;flex-direction:column;gap:28px;margin-top:14px}
  .btn{display:inline-block;background:var(--red);color:var(--white);font-size:15px;font-weight:700;padding:14px 26px;border-radius:99px;border:none;cursor:pointer;text-decoration:none}

  /* caricamento: la sagoma della pagina */
  .skel{display:flex;flex-direction:column;gap:16px;margin-top:22px}
  .skel i{display:block;border-radius:20px;background:linear-gradient(90deg,var(--pink) 25%,var(--paper) 37%,var(--pink) 63%);background-size:400% 100%;animation:shimmer 1.5s ease infinite}
  @keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}

  /* stati: accesso richiesto, programma spento, errore */
  .gate{text-align:center;padding:36px 12px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .gate img{width:132px;height:auto}
  .gate h1{font-family:var(--display);font-size:32px;font-weight:700;line-height:1.05;text-wrap:balance}
  .gate p{font-size:15px;color:var(--muted);max-width:34ch}

  /* saluto + Mimi */
  .hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}
  .hello{font-family:var(--display);font-size:44px;font-weight:700;line-height:.98}
  .mood{font-size:14px;color:var(--muted);margin-top:8px;max-width:22ch;min-height:2.9em}
  .hero-mimi{position:relative;width:128px}
  .hero-mimi img{display:block;width:100%;height:auto;animation:floaty 3.6s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(163,0,8,.16))}
  .hero-mimi.squee img{animation:squee .7s ease}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes squee{0%{transform:scale(1)}30%{transform:scale(1.09) rotate(-3deg)}60%{transform:scale(.97) rotate(2deg)}100%{transform:scale(1)}}
  .spark{position:absolute;width:16px;height:16px;background:var(--red);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);pointer-events:none;animation:rise 1.2s ease-out forwards;z-index:5}
  @keyframes rise{0%{opacity:0;transform:translateY(6px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-58px) scale(1.2)}}
  .confetti{position:fixed;width:10px;height:10px;z-index:95;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{0%{opacity:1;transform:translateY(-10px) rotate(0)}100%{opacity:.9;transform:translateY(100vh) rotate(540deg)}}

  /* avvisi: evento dal QR, compleanno */
  .note{display:flex;align-items:center;gap:12px;background:var(--white);border:1.5px solid var(--red);border-radius:20px;padding:14px 16px;font-size:14px}
  .note b{display:block;font-family:var(--display);font-size:21px;font-weight:700;line-height:1.1;color:var(--red-deep)}
  .note .txt{flex:1;min-width:0}
  .note .mini{flex:none;background:var(--red);color:var(--white);border:none;border-radius:99px;font-size:14px;font-weight:700;padding:0 16px;min-height:44px;cursor:pointer}
  .percorso:focus{outline:none}

  /* bandierina a scacchi */
  .flag{position:relative;display:block;width:22px;height:30px;flex:none}
  .flag::before{content:"";position:absolute;left:2px;top:0;bottom:0;width:2px;border-radius:2px;background:var(--red-deep)}
  .flag i{position:absolute;left:4px;top:1px;width:17px;height:13px;border:1px solid var(--red-deep);transform-origin:left center;opacity:.32;background:var(--chk) 0 0/8px 8px}
  .flag.on i{opacity:1;animation:wave 1.7s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-9deg)}}

  /* punti e percorso */
  .percorso{background:var(--white);border:1.5px solid var(--line);border-radius:20px;padding:22px 16px 18px;display:flex;flex-direction:column;gap:12px}
  .pts{display:flex;align-items:baseline;justify-content:center;gap:10px}
  .pts .n{font-family:var(--display);font-size:68px;font-weight:700;color:var(--red);line-height:.85;font-variant-numeric:tabular-nums}
  .pts .l{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .walk{position:relative;height:106px;margin:0 26px}
  .walk .rail{position:absolute;left:0;right:0;bottom:22px;height:14px;border-radius:99px;background:var(--pink);box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
  .walk .rail i{display:block;height:100%;width:0;background:var(--red);border-radius:99px;transition:width 1s var(--ease)}
  .walk .ms{position:absolute;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
  .walk .ms .flag{margin-bottom:14px;margin-left:16px}
  .walk .ms span{font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;line-height:22px}
  .walk .ms.on span{color:var(--red-deep)}
  .walk .walker{position:absolute;bottom:31px;left:0;transform:translateX(-50%);transition:left 1s var(--ease);z-index:3}
  .walk .walker img{display:block;width:48px;height:auto;filter:drop-shadow(0 3px 3px rgba(163,0,8,.18))}
  .walk .walker.go img{animation:step .32s ease-in-out infinite}
  @keyframes step{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-5px) rotate(3deg)}}
  .status{text-align:center;font-size:15px}
  .status b{color:var(--red-deep)}
  .rbtn{background:var(--red);color:var(--white);border:none;border-radius:99px;font-size:15px;font-weight:700;padding:15px 18px;cursor:pointer;width:100%;transition:transform .12s,opacity .2s}
  .rbtn[disabled]{background:var(--pink);color:var(--muted);cursor:default}
  .bonus2{font-size:13px;color:var(--muted);text-align:center;border-top:1.5px dashed var(--line);padding-top:12px}
  .bonus2 b{color:var(--red-deep)}

  /* i tuoi codici */
  .codici{list-style:none;display:grid;gap:8px}
  .cod{display:flex;align-items:center;gap:12px;background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px}
  .cod-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .cod-c{font-weight:700;font-size:16px;letter-spacing:.04em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .cod-m{font-size:13px;color:var(--muted)}
  .cod.used{background:transparent}
  .cod.used .cod-c{color:var(--muted);text-decoration:line-through}
  .cp{flex:none;background:var(--red);color:var(--white);border:none;border-radius:99px;font-size:14px;font-weight:700;padding:0 16px;min-width:80px;min-height:44px;cursor:pointer}
  .chip{flex:none;font-size:12px;font-weight:600;color:var(--muted);border:1.5px solid var(--line);border-radius:99px;padding:6px 11px}
  .link{background:none;border:none;color:var(--red-deep);font-size:14px;font-weight:600;text-decoration:underline;cursor:pointer;padding:0 4px;min-height:44px;margin-top:4px}

  /* ogni giorno */
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .act{border-radius:16px;padding:16px 10px;text-align:center;font-size:15px;font-weight:700;border:1.5px solid var(--red);background:var(--white);color:var(--red-deep);min-height:72px;transition:transform .12s}
  .act small{display:block;font-weight:500;font-size:12.5px;margin-top:3px;color:var(--muted)}
  .act.main{background:var(--red);color:var(--white)}
  .act.main small{color:var(--white)}
  .act.done{background:var(--pink);border-color:var(--pink);color:var(--muted);cursor:default}

  /* come prendi i punti */
  .regole{list-style:none;display:grid;gap:11px}
  .regole li{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:15px}
  .regole b{color:var(--red-deep);font-weight:600;text-align:right;white-space:nowrap}
  .fine{font-size:13px;color:var(--muted);margin-top:14px}
  .fine b{color:var(--ink);font-weight:600}

  /* le tue borse */
  .ward{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .witem{background:var(--white);border-radius:14px;padding:7px;border:1.5px solid var(--line);min-width:0}
  .witem img,.witem .noimg{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:9px;background:var(--pink)}
  .witem figcaption{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.25;text-align:center;overflow-wrap:anywhere}
  .empty{background:var(--white);border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;font-size:14px;color:var(--muted)}

  /* profilo (compleanno, materiale): solo a flag acceso */
  .prof{background:var(--white);border:1.5px solid var(--line);border-radius:20px;padding:18px 16px}
  .prof .row{display:flex;gap:8px;margin-top:10px}
  .prof label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
  .prof select{width:100%;border:1.5px solid var(--line);border-radius:14px;background:var(--white);padding:11px 10px;font:inherit;font-size:16px;color:var(--ink)}
  .prof select[disabled]{background:var(--pink-soft);color:var(--muted)}
  .prof .chk{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:13px;color:var(--muted);line-height:1.4}
  .prof .chk input{margin-top:2px;accent-color:var(--red);width:18px;height:18px;flex:none}
  .prof .chk label{font-size:13px;font-weight:400;margin:0}
  .prof .sbtn{width:100%;margin-top:14px;background:var(--red);color:var(--white);border:none;border-radius:99px;font-size:15px;font-weight:700;padding:14px;cursor:pointer}
  .prof .sbtn[disabled]{opacity:.55;cursor:default}
  .prof .sum{font-size:15px;line-height:1.7}
  .prof .sum b{color:var(--red-deep)}
  .prof .got{display:inline-block;font-size:13px;font-weight:600;color:var(--red-deep);margin-top:8px}
  .prof .pnote{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.4}
  .prof .pnote b{color:var(--ink)}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--white);font-size:14px;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:96;max-width:88%;text-align:center}
  #toast.on{opacity:.96;transform:translateX(-50%) translateY(0)}

  /* finestre: memory e premio */
  .modal{position:fixed;inset:0;background:rgba(43,18,21,.6);display:flex;align-items:center;justify-content:center;z-index:90;opacity:0;visibility:hidden;transition:opacity .25s,visibility 0s .25s;padding:20px}
  .modal.on{opacity:1;visibility:visible;transition:opacity .25s}
  .sheet{background:var(--paper);border-radius:20px;padding:24px 20px 18px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 50px rgba(43,18,21,.35)}
  .sheet h2{font-size:29px;margin-bottom:4px}
  .sheet p{font-size:14px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0 10px}
  .card{position:relative;aspect-ratio:3/4;border:none;padding:0;background:none;border-radius:12px;cursor:pointer;perspective:700px}
  .card[disabled]{cursor:default}
  .card .in{position:absolute;inset:0;border-radius:12px;transition:transform .38s var(--ease);transform-style:preserve-3d}
  .card.up .in,.card.done .in{transform:rotateY(180deg)}
  .card .back,.card .front{position:absolute;inset:0;border-radius:12px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .card .back{background:var(--chk) 0 0/50% 37.5%;border:1.5px solid var(--red-deep);display:flex;align-items:center;justify-content:center}
  .card .back img{width:46%;height:auto;background:var(--white);border-radius:50%;padding:5px;box-shadow:0 0 0 1.5px var(--red-deep)}
  .card .front{transform:rotateY(180deg);background:var(--white);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center}
  .card .front img{display:block;width:100%;height:100%;object-fit:cover}
  .card .front.glyph img{width:70%;height:auto;object-fit:contain}
  .card .front.glyph.chk{background:var(--chk) 0 0/50% 37.5%}
  .card .front.glyph.word{font-family:var(--display);font-style:italic;font-weight:600;font-size:22px;color:var(--red-deep)}
  .card.done .front{border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
  .card.loading .back{opacity:.5}
  .prizebig{font-family:var(--display);font-size:60px;font-weight:700;color:var(--red);line-height:1;margin:6px 0}
  .codechip{display:flex;align-items:center;gap:8px;background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:10px 10px 10px 14px;margin:12px 0 4px;text-align:left}
  .codechip .c{flex:1;min-width:0;font-weight:700;font-size:17px;letter-spacing:.04em;overflow-wrap:anywhere}
  .sheet .btn{width:100%;margin-top:14px}
  .btnghost{background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;margin-top:4px;padding:0 12px;min-height:44px;cursor:pointer;text-decoration:underline}

  @media (min-width:420px){ .hero-mimi{width:146px} .hello{font-size:50px} }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
  <a class="logo" href="/" aria-label="Amimì, torna al sito">amìmì</a>

  <!-- stato: caricamento -->
  <div id="loading" class="skel" role="status" aria-label="Carico i tuoi punti Mimì">
    <i style="height:118px"></i><i style="height:262px"></i><i style="height:76px"></i>
  </div>

  <!-- stato: accesso richiesto / programma spento / errore -->
  <div id="gate" class="gate hidden">
    <img data-mimi alt="">
    <h1 id="gateTitle"></h1>
    <p id="gateMsg"></p>
    <a id="gateBtn" class="btn" href="/account">Accedi</a>
    <button id="gateRetry" class="btn hidden" type="button">Riprova</button>
  </div>

  <!-- area membri -->
  <main id="app" class="hidden">
    <div class="hero">
      <div>
        <h1 class="hello">Ciao,<br>amica</h1>
        <p class="mood" id="mood"></p>
      </div>
      <div class="hero-mimi" id="mimi"><img data-mimi alt="Mimì, la borsetta di Amimì"></div>
    </div>

    <div id="evento" class="note hidden" role="status"></div>
    <div id="bday" class="note hidden"></div>

    <section class="percorso" id="redeem" aria-label="I tuoi punti Mimì" tabindex="-1">
      <div class="pts"><span class="n" id="pts">0</span><span class="l">punti Mimì</span></div>
      <div class="walk hidden" id="walk" role="img"></div>
      <p class="status" id="pathStatus"></p>
      <div id="redeemBox"></div>
      <div id="bonus2" class="bonus2 hidden"></div>
    </section>

    <section id="codiciSec" class="hidden">
      <h2>I tuoi codici</h2>
      <ul id="codici" class="codici"></ul>
      <button id="codiciTutti" class="link hidden" type="button"></button>
    </section>

    <section>
      <h2>Ogni giorno</h2>
      <div class="acts">
        <button class="act main tap" id="btnCoccola" type="button"></button>
        <button class="act tap" id="btnGame" type="button"></button>
      </div>
    </section>

    <section id="profSec" class="hidden">
      <h2>Il tuo profilo</h2>
      <div id="profilo" class="prof"></div>
    </section>

    <section id="regoleSec">
      <h2>Come prendi i punti</h2>
      <ul class="regole" id="regole"></ul>
      <p class="fine" id="regoleNota"></p>
    </section>

    <section>
      <h2>Le tue borse</h2>
      <div id="ward"></div>
    </section>
  </main>

  <!-- memory -->
  <div class="modal" id="gameModal" role="dialog" aria-modal="true" aria-labelledby="gameTitle" aria-hidden="true"><div class="sheet">
    <h2 id="gameTitle">Trova le coppie</h2>
    <p id="gameMsg">Abbina le borse uguali e vinci i punti di oggi.</p>
    <div class="grid" id="grid"></div>
    <button class="btnghost" id="gameClose" type="button">Chiudi</button>
  </div></div>

  <!-- premio -->
  <div class="modal" id="rewardModal" role="dialog" aria-modal="true" aria-labelledby="rewardTitle" aria-hidden="true"><div class="sheet">
    <h2 id="rewardTitle">Complimenti!</h2>
    <div class="prizebig" id="rewardPrize"></div>
    <p id="rewardMsg"></p>
    <div id="rewardCode"></div>
    <button class="btn" id="rewardOk" type="button">Continua</button>
  </div></div>

  <div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  // === CONFIG (i punti veri, il costo e il valore del premio arrivano dall'edge) ===
  const CONFIG = {
    traguardi: 3,          // bandierine visibili sul percorso: le ultime due raggiunte e la prossima
    codiciVisibili: 3,     // codici mostrati prima di "Mostra tutti"
    coppie: 3,             // coppie del memory
    eventoOre: 12,         // per quante ore il codice di un QR resta in attesa dell'accesso
    materiali: ['cavallino','cocco','vernice','pelle liscia','cotone','nessuna preferenza'],   // lista chiusa, uguale al check a DB (migr 0141)
    mesi: ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'],
  };
  const PROXY = '/apps/premia';         // same-origin su amimi.it
  const MIMI = '__MIMI_DATA_URI__';
  const el = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));   // tutto cio' che entra in innerHTML passa da qui (audit T7)
  const reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  let S = null;                          // stato reale dall'edge
  let tuttiICodici = false;
  document.querySelectorAll('[data-mimi]').forEach(i => { i.src = MIMI; });

  // === API reale (rispecchia loyalty-proxy) ===
  async function api(action, opts){
    const o = opts || {};
    const url = PROXY + '/' + action;
    const init = { method: o.method || 'GET', headers: { 'Content-Type':'application/json' }, credentials:'include' };
    if (o.body) init.body = JSON.stringify(o.body);
    let r;
    try { r = await fetch(url, init); } catch(e) { return { status:0, data:{ error:'network' } }; }   // offline o rete: gli handler mostrano "Riprova" (audit T30)
    let data = {}; try { data = await r.json(); } catch(e){}
    return { status:r.status, data };
  }

  // === tracciamento (loyalty-proxy v13, migr 0146 e 0150): apertura, card viste, tap. Solo nome dell'evento e dell'elemento,
  // in lotti (max 20, invio dopo 4 s o quando la pagina va in background), max 60 per caricamento pagina. A flag
  // loyalty_track_enabled spento il server risponde {state:'off'} e la pagina smette di mandare. Mai bloccante, mai un toast.
  const T = { q:[], sent:0, off:false, seen:{}, timer:null, started:false, MAX:60 };
  function track(e, name){
    if(T.off || T.sent + T.q.length >= T.MAX) return;
    if(e==='view'){ if(T.seen[name]) return; T.seen[name]=1; }
    T.q.push(name ? { e:e, el:name } : { e:e });
    if(!T.timer) T.timer=setTimeout(flush, 4000);
  }
  function flush(){
    clearTimeout(T.timer); T.timer=null;
    if(T.off || !T.q.length) return;
    const batch=T.q.splice(0,20); T.sent+=batch.length;
    fetch(PROXY+'/track', { method:'POST', headers:{ 'Content-Type':'application/json' }, credentials:'include', keepalive:true, body:JSON.stringify({ events:batch }) })
      .then(r=>r.json()).then(d=>{ if(d && d.state==='off'){ T.off=true; T.q=[]; } else if(T.q.length) flush(); }).catch(()=>{});
  }
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flush(); });
  // "vista" = meta' della card a schermo, oppure almeno 40% dello schermo occupato (una card piu' alta di due schermi, es. un guardaroba lungo, non arriva mai al 50%)
  const io = ('IntersectionObserver' in window) ? new IntersectionObserver(es=>{ es.forEach(x=>{ if(x.isIntersecting && x.target.dataset.trk && (x.intersectionRatio>=0.5 || x.intersectionRect.height>=window.innerHeight*0.4)) track('view', x.target.dataset.trk); }); }, { threshold:[0,0.25,0.5] }) : null;
  function watch(id, name){ const n=el(id); if(!n || !io) return; if(name) n.dataset.trk=name; io.observe(n); }
  function trackStart(){
    if(T.started) return; T.started=true;
    track('page_open');
    watch('redeem'); watch('codiciSec','codici'); watch('profSec','profilo'); watch('mimi','mimi'); watch('regoleSec','regole'); watch('ward','guardaroba'); watch('bonus2','bonus2'); watch('bday','bday'); watch('evento','evento');
  }

  // === piccoli effetti ===
  function toast(m){ const t=el('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2400); }
  function sparkles(host,n){ if(reduced) return; n=n||6; for(let k=0;k<n;k++){ (function(k){ setTimeout(()=>{ const h=document.createElement('i'); h.className='spark'; const z=10+Math.random()*10; h.style.width=h.style.height=z+'px'; h.style.left=(8+Math.random()*78)+'%'; h.style.top=(18+Math.random()*46)+'%'; host.appendChild(h); setTimeout(()=>h.remove(),1300); }, k*110); })(k);} }
  function squee(){ const m=el('mimi'); m.classList.remove('squee'); void m.offsetWidth; m.classList.add('squee'); setTimeout(()=>m.classList.remove('squee'),750); }
  function confetti(){ if(reduced) return; const cols=['#E10A0A','#F9CBD0','#FFFFFF','#A30008','#F3BFC6']; for(let i=0;i<64;i++){ const c=document.createElement('div'); c.className='confetti'; c.style.left=Math.random()*100+'%'; c.style.top='-10px'; c.style.background=cols[i%cols.length]; c.style.animationDuration=(1.6+Math.random()*1.3)+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),3200);} }
  // il conteggio e' solo estetica: il valore finale arriva comunque dopo 900 ms, anche se la scheda e' in secondo piano e i fotogrammi sono fermi
  function countUp(node,to){ const from=Number(node.textContent)||0; clearTimeout(node._end); node._to=to; if(from===to || reduced){node.textContent=to;return;} const t0=performance.now(); (function step(t){ if(node._to!==to) return; const k=Math.min(1,(t-t0)/700); node.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(step); })(performance.now()); node._end=setTimeout(()=>{ if(node._to===to) node.textContent=to; },900); }
  function itDate(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||'')); return m ? (m[3]+'/'+m[2]+'/'+m[1]) : ''; }
  function thumb(u, w){ u=String(u||''); return u.indexOf('https://cdn.shopify.com/')===0 ? u+(u.indexOf('?')<0?'?':'&')+'width='+w : u; }   // il CDN Shopify ridimensiona con ?width=
  async function copyCode(code, btn){
    track('tap','copy_code');
    try{ await navigator.clipboard.writeText(code); toast('Codice copiato'); if(btn){ const old=btn.textContent; btn.textContent='Copiato'; setTimeout(()=>{ btn.textContent=old; },1800); } }
    catch(_){ toast('Codice: '+code); }
  }

  function closeModal(id){ const m=el(id); if(!m.classList.contains('on')) return; m.classList.remove('on'); m.setAttribute('aria-hidden','true'); const back=(lastFocus && lastFocus!==document.body && document.contains(lastFocus)) ? lastFocus : el('redeem'); if(back && back.focus) back.focus(); }   // il bottone di partenza puo' essere stato ridisegnato: si torna alla card dei punti
  document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal('gameModal'); closeModal('rewardModal'); } });

  // === percorso: una bandierina a scacchi ogni <costo del premio> punti. Finestra di tre traguardi che scorre. ===
  function renderPath(){
    const w=el('walk'), rw=reward0(), p=S.points||0;
    if(!rw || !(Number(rw.cost_points)>0)){ w.classList.add('hidden'); return; }   // senza catalogo premi restano solo i punti
    const cost=Number(rw.cost_points), n=CONFIG.traguardi, k=Math.floor(p/cost), base=Math.max(0,k-(n-1))*cost;
    const pct=Math.max(0,Math.min(1,(p-base)/(n*cost)))*100;
    if(!w.dataset.built){
      let h='<div class="rail"><i></i></div>';
      for(let i=1;i<=n;i++) h+='<div class="ms" style="left:'+(i/n*100).toFixed(3)+'%"><span class="flag"><i></i></span><span></span></div>';
      w.innerHTML=h+'<div class="walker"><img alt="" src="'+MIMI+'"></div>';
      w.dataset.built='1';
    }
    w.classList.remove('hidden');
    w.querySelectorAll('.ms').forEach((ms,i)=>{ const val=base+(i+1)*cost, on=p>=val; ms.classList.toggle('on',on); ms.querySelector('.flag').classList.toggle('on',on); ms.lastElementChild.textContent=val; });
    const walker=w.querySelector('.walker'), fill=w.querySelector('.rail i');
    const move=()=>{ fill.style.width=pct+'%'; walker.style.left=pct+'%'; };
    if(w.dataset.pct===undefined){ setTimeout(move,60); } else move();   // al primo disegno Mimi' parte da zero e cammina fino al suo punto
    if(!reduced && w.dataset.pct!==String(pct)){ walker.classList.add('go'); clearTimeout(walker._t); walker._t=setTimeout(()=>walker.classList.remove('go'),1000); }
    w.dataset.pct=String(pct);
    w.setAttribute('aria-label','Hai '+p+' punti Mimì. Prossima bandierina a '+((k+1)*cost)+' punti.');
  }

  // === riscatto (punti -> codice sconto). Catalogo e riscatti dall'edge (azioni rewards/redeem). ===
  function renderRedeem(){
    const box=el('redeem'), out=el('redeemBox'), st=el('pathStatus'), rd=S && S._rewards, rw=reward0();
    if(!rw){ out.innerHTML=''; st.innerHTML=''; delete box.dataset.trk; return; }
    const p=S.points||0, reds=rd.redemptions||[], cost=Number(rw.cost_points), k=Math.floor(p/cost), manca=cost-(p%cost);
    const pending=reds.find(x=>x.status==='pending');
    const punti = manca===1 ? '1 punto' : manca+' punti';
    box.dataset.trk = pending ? 'redeem_pending' : (p>=rw.cost_points ? 'redeem_ready' : 'redeem_locked');   // letto dal tracciamento quando la card entra in vista
    if(pending){ st.innerHTML='Riscatto ricevuto. Il tuo codice sta arrivando.'; out.innerHTML=''; return; }
    if(p>=rw.cost_points){
      // il riscatto e' RIPETIBILE: uno sconto ogni <cost> punti
      const cosa = rw.value ? (k===1 ? '1 sconto del '+esc(rw.value)+'%' : k+' sconti del '+esc(rw.value)+'%') : (k===1 ? '1 premio' : k+' premi');
      st.innerHTML='Hai <b>'+cosa+'</b> da riscattare. Il prossimo fra '+punti+'.';
      out.innerHTML='<button class="rbtn tap" type="button" id="rbtn" data-reward="'+esc(rw.key)+'">Riscatta '+(rw.value ? 'il '+esc(rw.value)+'%' : 'il premio')+' · '+cost+' punti</button>';
    } else {
      st.innerHTML=(manca===1 ? 'Ti manca' : 'Ti mancano')+' <b>'+punti+'</b> '+(rw.value ? 'allo sconto del '+esc(rw.value)+'%' : 'al premio')+'.';
      out.innerHTML='';

  async function refresh(animate){
    const [st, rw, pf] = await Promise.all([api('state'), api('rewards'), api('profile')]);   // rewards/profile: OFF finche' i flag sono spenti
    const { status, data } = st;
    if (data.state==='login_required') return showGate(EVT ? 'Accedi e prendi i punti dell\'evento' : 'I tuoi punti Mimì', EVT ? 'Entra con il tuo account Amimì, oppure creane uno in un minuto: i punti dell\'evento arrivano subito dopo.' : 'Accedi con il tuo account Amimì per vedere i tuoi punti e coccolare Mimì.', 'login');
    if (data.state==='needs_secret' || data.state==='off') return showGate('I punti Mimì stanno arrivando','Il programma parte a breve. Torna presto!', '');
    if (status===503 || data.error) return showGate('Un attimo...','Non riesco a leggere i tuoi punti in questo momento.', 'retry');
    S = data;
    S._rewards = (rw && rw.data && Array.isArray(rw.data.rewards)) ? rw.data : null;
    S._profile = (pf && pf.status===200 && pf.data && !pf.data.error && typeof pf.data.profile_enabled==='boolean') ? pf.data : null;   // non leggibile = come a flag OFF, mai una card finta
    render();
    trackStart();
    checkin();
  }

  // dell'evento, una presenza per cliente, tetto. Qui si mostra solo l'esito.
  const EVT_KEY='mimi_evento';
  function evtStored(){ try{ const o=JSON.parse(localStorage.getItem(EVT_KEY)||'null'); return (o && o.c && Date.now()-o.t < CONFIG.eventoOre*3600000) ? String(o.c) : ''; }catch(_){ return ''; } }
  function evtClear(){ EVT=''; try{ localStorage.removeItem(EVT_KEY); }catch(_){}
    try{ const u=new URL(location.href); if(u.searchParams.has('evento')){ u.searchParams.delete('evento'); history.replaceState(null,'',u.pathname+u.search+u.hash); } }catch(_){} }
  let EVT=(()=>{ let c=''; try{ c=(new URLSearchParams(location.search).get('evento')||'').trim().toUpperCase(); }catch(_){}
    if(/^[A-Z0-9_-]{4,40}$/.test(c)){ try{ localStorage.setItem(EVT_KEY, JSON.stringify({ c:c, t:Date.now() })); }catch(_){} return c; }
    return evtStored(); })();
  let evtBusy=false;
  function evtNote(title,msg,retry){
    const n=el('evento'); n.classList.remove('hidden');
    n.innerHTML='<span class="flag on"><i></i></span><span class="txt"><b>'+esc(title)+'</b>'+esc(msg)+'</span>'+(retry ? '<button class="mini tap" type="button" id="evtRetry">Riprova</button>' : '');
  }
  el('evento').addEventListener('click', e=>{ if(e.target.closest('#evtRetry')) checkin(); });
  async function checkin(){
    if(!EVT || !S || evtBusy) return;
    evtBusy=true;
    const { data } = await api('checkin',{method:'POST',body:{code:EVT}});
    evtBusy=false;
    const nome = data && data.label ? String(data.label) : 'questo evento';
    if(data && data.state==='off'){ evtClear(); return; }                               // presenze spente: niente da mostrare
    if(data && data.ok && !data.already){
      evtClear(); S.points=data.points; render();
      evtNote('Presenza registrata', '+'+(data.added||0)+' punti Mimì per '+nome+'.');
      reward('Eccoti qui!', '+'+(data.added||0), 'punti Mimì per '+nome);
      return;
    }
    if(data && data.ok && data.already){ evtClear(); evtNote('Punti già presi', 'La tua presenza per '+nome+' è già registrata.'); return; }
    const r = data && data.reason;
    if(r==='not_started'){ evtNote('Non è ancora ora', 'I punti per '+nome+' si prendono durante l\'evento. Riprova quando sei lì.', true); return; }   // il codice resta in attesa
    if(r==='ended'){ evtClear(); evtNote('Evento finito', 'I punti per '+nome+' non sono più disponibili.'); return; }
    if(r==='full'){ evtClear(); evtNote('Punti esauriti', 'I punti per '+nome+' sono finiti.'); return; }
    if(r==='unknown_event'){ evtClear(); evtNote('QR non valido', 'Questo codice evento non esiste. Chiedi a noi di Amimì.'); return; }
    evtNote('Presenza non registrata', 'Non riesco a registrare la tua presenza in questo momento.', true);
  }

  // === azioni ===
  el('btnCoccola').addEventListener('click', async ()=>{
    if(!S || !S.coccola_disponibile) return;
    track('tap','coccola');
    const { data } = await api('coccola');
    if(data.done_today){ toast('Mimì è già stata coccolata oggi'); return; }
    if(data.error){ toast('Riprova fra poco'); return; }
    S.points=data.points; S.coccola_disponibile=false; squee(); sparkles(el('mimi'),7); render(); toast('+'+(data.added||5)+' punti Mimì, coccola di oggi fatta');
  });

  // riscatto (bottone disabilitato subito = anti doppio-click; idemp lato server)
  el('redeem').addEventListener('click', async e=>{
    const btn=e.target.closest('#rbtn'); if(!btn||!S) return;
    track('tap','redeem');
    const rw=reward0()||{};
    const pct=rw.value?('-'+rw.value+'%'):'Sconto';
    btn.disabled=true; btn.textContent='Riscatto...';
    const idemp='r-'+Date.now()+'-'+Math.random().toString(36).slice(2,10);
    const { data } = await api('redeem',{method:'POST',body:{reward:btn.dataset.reward, idemp}});
    if(data && data.ok){
      await refresh(false);
      if(data.code) reward('Sconto sbloccato!', pct, 'Usalo al checkout. Vale una volta e non si somma ad altri sconti.', data.code);
      else toast('Riscatto ricevuto, codice in arrivo');
    } else if(data && data.reason==='insufficient'){ toast('Punti non sufficienti'); renderRedeem(); }
    else { toast('Riprova fra poco'); btn.disabled=false; btn.textContent='Riprova'; }
  });

  // === memory con le foto vere: il mazzo arriva dall'edge (azione deck), il premio lo decide memory_win ===
  let DECK=null;                                                                          // null = non ancora chiesto
  const RISERVA=[{ g:'mimi' },{ g:'chk' },{ g:'word' }];                                  // mazzo di riserva se le foto non arrivano
  function preload(u){ return new Promise(res=>{ const i=new Image(); let done=false; const end=ok=>{ if(done) return; done=true; res(ok ? u : null); }; i.onload=()=>end(true); i.onerror=()=>end(false); setTimeout(()=>end(false),5000); i.src=u; }); }
  async function loadDeck(){
    if(DECK) return DECK;
    const { status, data } = await api('deck');
    const cards=(status===200 && data && Array.isArray(data.cards)) ? data.cards.filter(c=>c && c.img) : [];
    const ok=(await Promise.all(cards.map(c=>preload(thumb(c.img,360))))).map((u,i)=> u ? { img:u, titolo:String(cards[i].titolo||'Borsa Amimì') } : null).filter(Boolean);
    DECK = ok.length>=CONFIG.coppie ? ok.slice(0,CONFIG.coppie) : RISERVA;
    return DECK;
  }
  function faceHTML(c){
    if(c.img) return '<span class="front"><img alt="" src="'+esc(c.img)+'"></span>';
    if(c.g==='mimi') return '<span class="front glyph"><img alt="" src="'+MIMI+'"></span>';
    if(c.g==='chk') return '<span class="front glyph chk"></span>';
    return '<span class="front glyph word">amìmì</span>';
  }
  function faceName(c, i){ return c.img ? c.titolo : (c.g==='mimi' ? 'Mimì' : (c.g==='chk' ? 'Scacchi' : 'Amimì')); }
  el('btnGame').addEventListener('click', ()=>{ if(!S||!S.memory_disponibile){ toast('Torna domani per un nuovo gioco'); return; } track('tap','gioco'); startGame(); });
  el('gameClose').addEventListener('click', ()=>closeModal('gameModal'));
  let partita=0;                                                                          // una sola partita alla volta riempie la griglia
  async function startGame(){
    const grid=el('grid'), n=CONFIG.coppie*2, mia=++partita;
    let h=''; for(let i=0;i<n;i++) h+='<button class="card loading" type="button" disabled aria-label="Carta coperta"><span class="in"><span class="back"><img alt="" src="'+MIMI+'"></span></span></button>';
    grid.innerHTML=h; el('gameMsg').textContent='Preparo le carte...';
    openModal('gameModal', el('gameClose'));
    const deck=await loadDeck();
    if(mia!==partita || !el('gameModal').classList.contains('on')) return;                // chiusa o riaperta mentre caricava
    el('gameMsg').textContent='Abbina le borse uguali e vinci i punti di oggi.';
    const order=[]; deck.forEach((c,i)=>{ order.push(i,i); }); order.sort(()=>Math.random()-0.5);
    let up=[], matched=0, lock=false;
    grid.querySelectorAll('.card').forEach((c,pos)=>{
      const k=order[pos], face=deck[k];
      c.dataset.k=String(k); c.querySelector('.in').insertAdjacentHTML('beforeend', faceHTML(face));
      c.classList.remove('loading'); c.disabled=false;
      c.addEventListener('click',()=>{
        if(lock||c.classList.contains('up')||c.classList.contains('done'))return;
        c.classList.add('up'); c.setAttribute('aria-label', faceName(face)); up.push(c);
        if(up.length===2){ lock=true;
          if(up[0].dataset.k===up[1].dataset.k){ up.forEach(x=>{ x.classList.add('done'); x.setAttribute('aria-label', faceName(deck[Number(x.dataset.k)])+', coppia trovata'); }); matched++; up=[]; lock=false;
            if(matched===CONFIG.coppie) setTimeout(winGame,500);
          } else setTimeout(()=>{ up.forEach(x=>{ x.classList.remove('up'); x.setAttribute('aria-label','Carta coperta'); }); up=[]; lock=false; },850);
        }
      });
    });
    const first=grid.querySelector('.card'); if(first) first.focus();
  }
  async function winGame(){
    closeModal('gameModal');
    const { data } = await api('memory_win');
    if(data.done_today){ toast('Hai già giocato oggi'); return; }
    if(data.error){ toast('Riprova fra poco'); return; }
    S.points=data.points; S.memory_disponibile=false; render();
    reward('Hai vinto!', '+'+(data.added||5), 'punti Mimì aggiunti al tuo saldo');
  }

  refresh(false);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prove pagina Area Membri</title>
<!--
  tests/loyalty_page_runner.html: prove automatiche della pagina Area Membri sul server finto (tests/loyalty_page_mock.js).
  Lo copia tests/loyalty_page_harness.mjs come run.html accanto a index.html. Si apre nel browser: ogni prova carica la
  pagina in un iframe, fa i gesti (tap, partita, riscatto) e controlla il risultato. Esito in testa: "N ok, M KO".
  ?solo=<testo> lancia solo le prove il cui nome contiene quel testo.
-->
<style>
  /* l'iframe resta SEMPRE a schermo (sticky): un iframe fuori vista non riceve requestAnimationFrame e il contatore dei punti non arriva in fondo */
  body{font:14px system-ui,sans-serif;margin:0;padding:12px;color:#222;display:grid;grid-template-columns:minmax(340px,1fr) auto;gap:14px;align-items:start}
  #log{min-width:0}
  h1{font-size:18px;margin:0 0 6px}
  #sum{font-size:16px;font-weight:700;margin:6px 0}
  #out{white-space:pre-wrap;font:12px ui-monospace,Consolas,monospace;line-height:1.45}
  .ko{color:#b00020;font-weight:700}.ok{color:#1b6b3a}
  iframe{position:sticky;top:8px;border:1px solid #ccc;height:calc(100vh - 24px);display:block;max-width:none}
</style>
</head>
<body>
<div id="log">
  <h1>Prove pagina Area Membri</h1>
  <div id="sum">in corso...</div>
  <div id="out"></div>
</div>
<iframe id="f" title="pagina in prova"></iframe>
<script>
(async function(){
  'use strict';
  const f=document.getElementById('f'), out=document.getElementById('out'), sum=document.getElementById('sum');
  const only=new URLSearchParams(location.search).get('solo');
  let ok=0, ko=0, last=null; const fails=[];
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const line=(t,c)=>{ const d=document.createElement('div'); d.className=c; d.textContent=t; out.appendChild(d); };
  async function until(fn, ms, what){ const t0=Date.now(); for(;;){ let v=false; try{ v=fn(); }catch(_){ v=false; } if(v) return v; if(Date.now()-t0>ms) throw new Error('attesa scaduta: '+what); await sleep(30); } }
  function assert(c, what){ if(!c) throw new Error(what); }
  function has(t, part, what){ assert(String(t).indexOf(part)>=0, (what||'testo')+': atteso "'+part+'", trovato "'+t+'"'); }

  async function open(s, o){
    o=o||{};
    if(!o.keepStore){ try{ localStorage.removeItem('mimi_evento'); }catch(_){} }
    f.style.width=(o.w||375)+'px';
    const q='index.html?s='+encodeURIComponent(s)+(o.evento!==undefined?'&evento='+encodeURIComponent(o.evento):'')+(o.lento?'&lento='+o.lento:'')+'&raf='+(o.raf||'timer')+'&_='+Date.now()+Math.random();
    await new Promise(r=>{ f.onload=r; f.src=q; });
    const win=f.contentWindow, doc=win.document;
    const $=sel=>doc.querySelector(sel), $$=sel=>Array.from(doc.querySelectorAll(sel));
    const c={ win, doc, $, $$,
      vis:sel=>{ const n=$(sel); return !!n && n.getClientRects().length>0 && win.getComputedStyle(n).visibility!=='hidden'; },
      txt:sel=>{ const n=$(sel); return n ? n.textContent.replace(/\s+/g,' ').trim() : ''; },
      calls:a=>win.__calls.filter(x=>x.action===a),
      toast:()=>($('#toast').classList.contains('on') ? $('#toast').textContent : ''),
    };
    last=c;
    if(!o.raw) await until(()=>$('#loading').classList.contains('hidden'), 6000, 'fine caricamento ('+s+')');
    return c;
  }
  async function test(name, fn){
    if(only && name.indexOf(only)<0) return;
    last=null;
    try{
      await fn();
      if(last && last.win.__errs && last.win.__errs.length) throw new Error('errori JS in pagina: '+last.win.__errs.join(' | '));
      ok++; line('ok  '+name,'ok');
    }catch(e){ ko++; fails.push(name); line('KO  '+name+'  <- '+((e && e.message) || e),'ko'); }
    sum.textContent=ok+' ok, '+ko+' KO (in corso...)';
  }
  // Mimi' ferma alla frazione f del giro: si aspetta TUTTA la condizione (posizione e fine camminata), non solo il numero
  const fermo=(c,f)=>c.$('#walk').dataset.f===f && !c.$('#walk .runner').classList.contains('go');
  const posto=c=>c.$('#walk .runner').style.left+' / '+c.$('#walk .runner').style.top;
  async function playMemory(c, sbaglia){
    c.$('#btnGame').click();
    await until(()=>c.$('#gameModal').classList.contains('on'), 1500, 'memory aperto');
    await until(()=>c.$$('#grid .card').length===6 && c.$$('#grid .card:not([disabled])').length===6, 12000, 'sei carte pronte');
    const by={}; c.$$('#grid .card').forEach(x=>{ (by[x.dataset.k]=by[x.dataset.k]||[]).push(x); });
    const ks=Object.keys(by);
    assert(ks.length===3 && ks.every(k=>by[k].length===2), 'tre coppie di carte');
    if(sbaglia){
      by[ks[0]][0].click(); by[ks[1]][0].click(); await sleep(150);
      assert(by[ks[0]][0].classList.contains('up') && by[ks[1]][0].classList.contains('up'), 'due carte diverse girate');
      by[ks[2]][0].click(); await sleep(60);
      assert(!by[ks[2]][0].classList.contains('up'), 'terza carta bloccata mentre due sono girate');
      await until(()=>!by[ks[0]][0].classList.contains('up') && !by[ks[1]][0].classList.contains('up'), 2500, 'carte diverse tornano coperte');
    }
    for(const k of ks){ by[k][0].click(); await sleep(60); by[k][1].click(); await sleep(140); assert(by[k][0].classList.contains('done') && by[k][1].classList.contains('done'), 'coppia trovata'); }
    return by;
  }

  // ---------- stati della pagina ----------
  await test('stato: accesso richiesto', async()=>{
    const c=await open('login');
    assert(c.vis('#gate') && !c.vis('#app'), 'cancello visibile, area nascosta');
    has(c.txt('#gateTitle'),'I tuoi punti Mimì'); assert(c.vis('#gateBtn') && !c.vis('#gateRetry'), 'solo il bottone Accedi');
    has(c.$('#gateBtn').getAttribute('href'),'/customer_authentication/login?return_to=','link di accesso con ritorno');
    assert(c.$('#gate img').getAttribute('src').indexOf('data:image/webp')===0, 'Mimì nel cancello');
  });
  await test('stato: programma spento', async()=>{
    const c=await open('spento');
    assert(c.vis('#gate') && !c.vis('#gateBtn') && !c.vis('#gateRetry'), 'messaggio senza bottoni'); has(c.txt('#gateTitle'),'stanno arrivando');
  });
  await test('stato: errore del server, Riprova richiama', async()=>{
    const c=await open('errore');
    assert(c.vis('#gate') && c.vis('#gateRetry') && !c.vis('#gateBtn'), 'solo Riprova'); has(c.txt('#gateMsg'),'Non riesco a leggere');
    const n=c.calls('state').length; c.$('#gateRetry').click();
    await until(()=>c.calls('state').length===n+1 && c.vis('#gate'), 3000, 'seconda lettura e cancello di nuovo');
  });
  await test('stato: rete assente', async()=>{ const c=await open('rete'); assert(c.vis('#gate') && c.vis('#gateRetry'), 'cancello con Riprova'); });
  await test('stato: gateway rotto (502 senza JSON) non diventa un profilo a zero punti', async()=>{ const c=await open('gateway'); assert(c.vis('#gate') && c.vis('#gateRetry') && !c.vis('#app'), 'cancello con Riprova, nessun profilo'); });
  await test('stato: risposta senza saldo non diventa un profilo', async()=>{ const c=await open('senza_saldo'); assert(c.vis('#gate') && c.vis('#gateRetry') && !c.vis('#app'), 'cancello con Riprova'); });
  await test('stato: firma scaduta (401)', async()=>{ const c=await open('firma'); assert(c.vis('#gate') && c.vis('#gateRetry'), 'cancello con Riprova'); });
  await test('stato: caricamento lento mostra la sagoma', async()=>{
    const c=await open('p257',{lento:900, raw:true});
    assert(c.vis('#loading') && !c.vis('#app'), 'sagoma visibile durante il caricamento');
    await until(()=>c.vis('#app') && !c.vis('#loading'), 5000, 'area visibile dopo il caricamento');
  });

  // ---------- punti e percorso ----------
  await test('punti: 0', async()=>{
    const c=await open('zero');
    assert(c.txt('#pts')==='0','saldo 0'); has(c.txt('#pathStatus'),'Ti mancano 100 punti allo sconto del 12%.');
    assert(!c.$('#rbtn'),'nessun bottone di riscatto'); assert(!c.vis('#codiciSec'),'nessun codice');
    assert(c.$$('#walk .lbl').map(t=>t.textContent).join()==='il tuo sconto' && c.$$('#walk .stop').length===0,'nessuna tappa, al traguardo "il tuo sconto"');
    assert(c.$('#walk').dataset.f==='0.0000' && !c.$('#walk .goal').classList.contains('on'),'Mimì alla partenza');
    assert(!c.$('#roadbox').classList.contains('con'),'nessuno spazio per il bottone'); has(c.txt('#ward'),'appariranno qui');
    assert(c.$('#redeem').dataset.trk==='redeem_locked','stato tracciato locked');
  });
  await test('punti: 45, Mimì al 45% del giro', async()=>{
    const c=await open('p45'); await until(()=>fermo(c,'0.4500'), 4000, 'Mimì al 45% del giro');
    has(c.txt('#pathStatus'),'Ti mancano 55 punti'); assert(!c.$('#walk .goal').classList.contains('pop') && c.$$('#walk .spark').length===0,'nessuna festa senza traguardo');
    has(c.$('#walk').getAttribute('aria-label'),'Hai 45 punti Mimì. Sei a 45 punti su 100 del giro verso il prossimo sconto.');
    assert(c.$('#walk .r-fg').getAttribute('stroke-dasharray')==='45.00 100','strada colorata fino al 45%'); assert(!c.$('#walk .runner').classList.contains('go'),'Mimì ferma a fine camminata');
  });
  await test('punti: 99, singolare', async()=>{ const c=await open('p99'); has(c.txt('#pathStatus'),'Ti manca 1 punto allo sconto del 12%.'); });
  await test('punti: 100, uno sconto pronto', async()=>{
    const c=await open('p100');
    has(c.txt('#pathStatus'),'Hai 1 sconto del 12% da riscattare. Il prossimo fra 100 punti.'); assert(c.txt('#rbtn')==='Ritira il 12%','bottone Ritira il 12%');
    await until(()=>fermo(c,'1.0000'), 4000, 'Mimì sul traguardo'); assert(c.$('#walk .goal').classList.contains('on'),'bandierina del traguardo accesa');
    assert(c.$('#roadbox').classList.contains('con') && getComputedStyle(c.$('#redeemBox')).position==='absolute','il bottone sta sulla strada'); assert(c.$('#walk .goal').classList.contains('pop'),'arrivo esatto a 100: la bandierina scatta'); has(c.$('#walk').getAttribute('aria-label'),'Sei al traguardo del giro.'); assert(c.$('#redeem').dataset.trk==='redeem_ready','stato tracciato ready');
  });
  await test('punti: 257, due sconti, codici in ordine', async()=>{
    const c=await open('p257');
    has(c.txt('#pathStatus'),'Hai 2 sconti del 12% da riscattare. Il prossimo fra 43 punti.'); await until(()=>fermo(c,'0.5700'), 4000, 'Mimì al 57% del terzo giro');
    assert(c.txt('#rbtn')==='Ritira il 12% · 2 pronti','due giri fatti = due sconti pronti sul bottone'); assert(!c.$('#walk .goal').classList.contains('pop') && c.$$('#walk .spark').length===0,'aprire la pagina a 257 punti non festeggia un traguardo che non si sta raggiungendo'); assert(!c.$('#walk .goal').classList.contains('on'),'traguardo no');
    const li=c.$$('#codici .cod'); assert(li.length===2,'due codici');
    has(li[0].textContent,'AMICA12-KTQWJJ'); has(li[0].textContent,'12% di sconto, da usare al checkout'); assert(!!li[0].querySelector('.cp'),'Copia sul codice da usare');
    has(li[1].textContent,'PREMIA-T20-6KQ4ZM'); has(li[1].textContent,'20% di sconto, usato il 28/09/2026'); assert(li[1].classList.contains('used') && !li[1].querySelector('.cp'),'codice usato senza Copia');
    assert(!c.vis('#codiciTutti'),'niente "Mostra tutti" con due codici');
  });
  await test('punti: 980, nove giri fatti e 25 codici', async()=>{
    const c=await open('p980');
    has(c.txt('#pathStatus'),'Hai 9 sconti del 12%'); await until(()=>fermo(c,'0.8000'), 4000, 'Mimì all\'80% del decimo giro');
    assert(c.txt('#rbtn')==='Ritira il 12% · 9 pronti','"9 pronti" sul bottone'); assert(!c.$('#walk .goal').classList.contains('pop'),'nessuna festa all\'apertura a 980 punti'); assert(c.$$('#walk .lbl').map(t=>t.textContent).join()==='il tuo sconto','il traguardo resta quello del giro');
    assert(c.$$('#codici .cod').length===3,'tre codici visibili');
    assert(c.$$('#codici .cod.used').length===0,'i primi tre sono da usare'); has(c.txt('#codiciTutti'),'Mostra tutti (25)');
    c.$('#codiciTutti').click(); assert(c.$$('#codici .cod').length===25,'25 codici dopo il tap'); has(c.txt('#codiciTutti'),'Mostra meno');
    const usati=c.$$('#codici .cod').map(x=>x.classList.contains('used')); assert(usati.indexOf(true)>usati.lastIndexOf(false),'tutti i da usare prima degli usati');
    c.$('#codiciTutti').click(); assert(c.$$('#codici .cod').length===3,'di nuovo tre');
  });

  // ---------- riscatto ----------
  await test('riscatto: codice consegnato, punti scalati, un solo invio col doppio tap', async()=>{
    const c=await open('p100'); const b=c.$('#rbtn'); b.click(); b.click();
    await until(()=>c.$('#rewardModal').classList.contains('on'), 3000, 'finestra del premio');
    assert(c.calls('redeem').length===1,'una sola chiamata redeem ('+c.calls('redeem').length+')');
    const body=c.calls('redeem')[0].body; assert(body.reward==='amica12' && String(body.idemp).length>=8 && !('points' in body),'body: reward + idemp, mai punti');
    has(c.txt('#rewardPrize'),'-12%'); const code=c.txt('#rewardCode .c'); assert(/^AMICA12-/.test(code),'codice nella finestra ('+code+')');
    assert(c.$('#rewardModal').getAttribute('aria-hidden')==='false','aria-hidden false'); await sleep(140); assert(c.doc.activeElement===c.$('#rewardOk'),'fuoco sul bottone Continua');
    c.$('#rewardCode .cp').click(); await sleep(250); assert(/copiato|Codice: AMICA12-/i.test(c.toast()),'copia: esito a schermo ('+c.toast()+')');
    c.$('#rewardOk').click(); assert(!c.$('#rewardModal').classList.contains('on'),'finestra chiusa');
    assert(c.doc.activeElement===c.$('#redeem'),'fuoco tornato alla card dei punti');
    assert(c.txt('#pts')==='0' || (await until(()=>c.txt('#pts')==='0',1500,'saldo a 0')),'saldo a 0');
    has(c.txt('#codici'),code,'codice nella lista'); has(c.txt('#pathStatus'),'Ti mancano 100 punti');
    assert(c.$('#walk').dataset.f==='0.0000' && !c.$('#walk .goal').classList.contains('on') && !c.$('#rbtn'),'dopo il riscatto: giro da capo, traguardo spento, nessun premio pronto');
  });
  await test('riscatto: in attesa di codice (pool vuoto)', async()=>{
    const c=await open('riscatto_vuoto'); c.$('#rbtn').click();
    await until(()=>/codice in arrivo/.test(c.toast()), 3000, 'avviso codice in arrivo');
    has(c.txt('#pathStatus'),'Riscatto ricevuto'); assert(!c.$('#rbtn'),'niente secondo riscatto finche\' e\' in attesa'); has(c.txt('#codici'),'In arrivo');
    assert(c.$('#redeem').dataset.trk==='redeem_pending','stato tracciato pending');
  });
  await test('riscatto: gia\' in attesa al caricamento', async()=>{ const c=await open('pending'); has(c.txt('#pathStatus'),'Riscatto ricevuto'); has(c.txt('#codici .cod'),'In preparazione'); });
  await test('riscatto: errore del server, si puo\' riprovare', async()=>{
    const c=await open('riscatto_ko'); c.$('#rbtn').click();
    await until(()=>c.txt('#rbtn')==='Riprova' && !c.$('#rbtn').disabled, 3000, 'bottone Riprova'); await until(()=>c.txt('#pts')==='130', 2000, 'saldo invariato a 130');
  });
  await test('riscatto: punti non sufficienti', async()=>{ const c=await open('riscatto_poco'); c.$('#rbtn').click(); await until(()=>/non sufficienti/.test(c.toast()), 3000, 'avviso'); });
  await test('riscatto: risposta persa, il Riprova rimanda lo stesso token e i punti scendono una volta sola', async()=>{
    const c=await open('riscatto_perso'); c.$('#rbtn').click();
    await until(()=>c.$('#rbtn') && c.txt('#rbtn')==='Riprova' && !c.$('#rbtn').disabled, 3000, 'bottone Riprova dopo la risposta persa');
    c.$('#rbtn').click(); await until(()=>c.$('#rewardModal').classList.contains('on'), 3000, 'finestra del premio al secondo tentativo');
    const k=c.calls('redeem'); assert(k.length===2 && k[0].body.idemp===k[1].body.idemp,'due chiamate con lo STESSO idemp ('+k.map(x=>x.body.idemp).join(' / ')+')');
    assert(/^AMICA12-/.test(c.txt('#rewardCode .c')),'il codice del primo tentativo arriva al secondo'); c.$('#rewardOk').click();
    await until(()=>c.txt('#pts')==='150', 2000, 'saldo 150: scalati 100 punti una volta sola (non 50)'); assert(c.$$('#codici .cod').length===1,'un solo codice');
    await until(()=>fermo(c,'0.5000'), 4000, 'Mimì a meta\' giro'); assert(c.txt('#rbtn')==='Ritira il 12%','resta un solo sconto pronto');
    c.$('#rbtn').click(); await until(()=>c.calls('redeem').length===3, 2000, 'terzo riscatto, voluto'); assert(c.calls('redeem')[2].body.idemp!==k[0].body.idemp,'un riscatto nuovo ha un token nuovo');
  });
  await test('sentiero: da 95 a 100 con la coccola Mimì arriva al traguardo, da 100 a 105 riparte', async()=>{
    let c=await open('p95'); await until(()=>fermo(c,'0.9500'), 4000, 'Mimì al 95%'); assert(!c.$('#rbtn'),'nessun premio prima del traguardo');
    c.$('#btnCoccola').click(); await until(()=>fermo(c,'1.0000'), 5000, 'Mimì sul traguardo dopo la coccola');
    assert(c.$('#walk .goal').classList.contains('on') && c.txt('#rbtn')==='Ritira il 12%','traguardo acceso, uno sconto pronto, bottone di riscatto');
    c=await open('p100'); await until(()=>fermo(c,'1.0000'), 4000, 'Mimì sul traguardo'); c.$('#btnCoccola').click();
    await until(()=>fermo(c,'0.0500'), 5000, 'Mimì riparte: 5% del giro nuovo'); assert(!c.$('#walk .goal').classList.contains('on') && c.txt('#rbtn')==='Ritira il 12%','traguardo spento, il bottone resta alle spalle di Mimì');
  });
  await test('sentiero: riscattare non sposta Mimì (stessa posizione, nessuna camminata)', async()=>{
    const c=await open('p257'); await until(()=>fermo(c,'0.5700'), 4000, 'Mimì al 57%'); const prima=posto(c);
    c.$('#rbtn').click(); await until(()=>c.$('#rewardModal').classList.contains('on'), 3000, 'premio');
    assert(posto(c)===prima && !c.$('#walk .runner').classList.contains('go') && c.$('#walk').dataset.f==='0.5700','stessa posizione di prima del riscatto ('+prima+' -> '+posto(c)+')');
    assert(c.txt('#rbtn')==='Ritira il 12%','dopo il riscatto ne resta uno pronto'); c.$('#rewardOk').click(); await until(()=>c.txt('#pts')==='157', 2000, 'saldo 157'); assert(posto(c)===prima,'ancora ferma dopo il conteggio');
  });
  await test('sentiero: acquisto che passa il traguardo (95 + 15), festa al passaggio e Mimì al 10% del giro nuovo', async()=>{
    const c=await open('p95'); await until(()=>fermo(c,'0.9500'), 4000, 'Mimì al 95%');
    c.win.__mock.db.points=105; c.$('#btnCoccola').click();                                 // la coccola porta a 110: il traguardo viene passato in corsa
    await until(()=>fermo(c,'0.1000'), 5000, 'Mimì al 10% del giro nuovo');
    assert(c.$('#walk .goal').classList.contains('pop') && !c.$('#walk .goal').classList.contains('on'),'la bandierina ha festeggiato al passaggio e poi e\' tornata spenta'); assert(c.txt('#rbtn')==='Ritira il 12%','uno sconto pronto');
  });
  await test('sentiero: a fotogrammi fermi (scheda in secondo piano) Mimì e il saldo arrivano lo stesso', async()=>{
    const c=await open('p257',{raf:'fermo'}); await until(()=>fermo(c,'0.5700') && c.txt('#pts')==='257', 5000, 'arrivo garantito dai timer');
    assert(!c.$('#walk .goal').classList.contains('pop'),'nessuna festa');
  });
  await test('sentiero: riscatto in attesa, nessun "pronto" finche\' il codice non arriva', async()=>{
    const c=await open('riscatto_vuoto'); await until(()=>fermo(c,'0.3000'), 4000, 'Mimì al 30%'); assert(c.txt('#rbtn')==='Ritira il 12% · 2 pronti','due pronti');
    c.$('#rbtn').click(); await until(()=>/Riscatto ricevuto/.test(c.txt('#pathStatus')), 3000, 'riscatto in attesa');
    assert(!c.$('#rbtn') && !c.$('#roadbox').classList.contains('con'),'con 130 punti e un riscatto in attesa non si promette un altro sconto');
  });
  await test('sentiero: un solo punto si scrive al singolare anche per i lettori di schermo', async()=>{
    const c=await open('zero'); c.win.__mock.db.points=96; c.$('#btnCoccola').click(); await until(()=>c.txt('#pts')==='101', 3000, 'saldo 101');
    has(c.$('#walk').getAttribute('aria-label'),'Sei a 1 punto su 100');
  });
  await test('premio a importo: mai una percentuale', async()=>{
    const c=await open('premio_importo');
    has(c.txt('#pathStatus'),'Hai 1 premio da riscattare'); assert(c.txt('#rbtn')==='Ritira il premio','bottone Ritira il premio'); has(c.txt('#regoleNota'),'10 euro di sconto');
    has(c.txt('#codici'),'DIECI-ABC123'); assert(!/10%/.test(c.$('#app').textContent),'nessun "10%" in pagina'); assert(c.txt('#walk .lbl.fine')==='il tuo premio','al traguardo "il tuo premio" per un premio non a percentuale'); has(c.$('#walk').getAttribute('aria-label'),'verso il prossimo premio');
  });
  await test('codici: i giorni sono quelli di Roma mandati dal server', async()=>{ const c=await open('mezzanotte'); has(c.txt('#codici'),'usato il 13/10/2026'); assert(!/12\/10\/2026/.test(c.txt('#codici')),'non la data UTC'); });
  await test('riscatto spento: restano solo i punti', async()=>{
    const c=await open('premi_off');
    await until(()=>c.txt('#pts')==='180', 2000, 'saldo 180'); assert(!c.vis('#walk') && c.txt('#pathStatus')==='' && !c.$('#rbtn') && c.txt('#regoleNota')==='','solo il saldo');
    assert(c.$$('#regole li').length===3,'regole base presenti');
  });
  await test('premio non a percentuale', async()=>{
    const c=await open('premio_fisso');
    has(c.txt('#pathStatus'),'Hai 1 premio da riscattare'); assert(c.txt('#rbtn')==='Ritira il premio','bottone Ritira il premio'); has(c.txt('#regoleNota'),'un portacarte in omaggio');
  });

  // ---------- azioni del giorno ----------
  await test('coccola: +5, poi non richiamabile', async()=>{
    const c=await open('p45'); c.$('#btnCoccola').click();

    assert(ev.every(x=>Object.keys(x).every(k=>k==='e'||k==='el') && (x.e==='page_open' || lista.indexOf(x.el)>=0)),'solo e/el e nomi della lista chiusa: '+JSON.stringify(ev));
  });

  // ---------- impaginazione e accessibilita' ----------
  for(const w of [320,375,768,1280]) for(const s of ['zero','p257','p980','profilo','login','pending','ugc_mine']){
    await test('impaginazione '+w+'px: '+s, async()=>{
      const c=await open(s,{w}); await sleep(250);
      assert(c.doc.documentElement.scrollWidth<=c.win.innerWidth+1,'nessuno scorrimento orizzontale ('+c.doc.documentElement.scrollWidth+' > '+c.win.innerWidth+')');
      const fuori=c.$$('main *, .gate *').filter(n=>{ if(n.closest('svg')) return false; const r=n.getBoundingClientRect(); return r.width>0 && (r.right>c.win.innerWidth+1 || r.left<-1); });
      assert(fuori.length===0,'elementi fuori schermo: '+fuori.slice(0,3).map(n=>n.tagName+'.'+n.className).join(', '));
      const bassi=c.$$('.rbtn,.act,.cp,.btn,.link,.sbtn,.mini').filter(n=>n.getClientRects().length && n.getBoundingClientRect().height<44);
      assert(bassi.length===0,'bottoni sotto i 44px: '+bassi.slice(0,3).map(n=>n.className+'='+Math.round(n.getBoundingClientRect().height)).join(', '));
      const tagliati=c.$$('main h1, main h2, main p, main li, main button, main figcaption, .gate h1, .gate p').filter(n=>n.getClientRects().length && n.scrollWidth>n.clientWidth+1);
      assert(tagliati.length===0,'testi tagliati: '+tagliati.slice(0,3).map(n=>n.tagName+':'+n.textContent.slice(0,30)).join(' | '));
    });
  }
  await test('accessibilita\': immagini, bottoni, finestre', async()=>{
    const c=await open('p980');
    assert(c.$$('img').every(i=>i.hasAttribute('alt')),'ogni immagine ha alt'); assert(c.$$('button').filter(b=>b.getClientRects().length).every(b=>b.textContent.trim().length>0 || b.getAttribute('aria-label')),'ogni bottone visibile ha un nome');
    assert(c.$$('.modal').every(m=>m.getAttribute('role')==='dialog' && m.getAttribute('aria-modal')==='true' && m.getAttribute('aria-hidden')==='true' && c.win.getComputedStyle(m).visibility==='hidden'),'finestre chiuse fuori dal giro del fuoco');
    assert(c.$('html').getAttribute('lang')==='it' && c.$$('h1').filter(h=>h.getClientRects().length).length===1,'lingua e un solo h1 visibile');
    assert(c.$('#walk').getAttribute('role')==='img' && c.$('#walk').getAttribute('aria-label') && c.$('#walk svg').getAttribute('aria-hidden')==='true','il sentiero ha una descrizione e il disegno e\' nascosto ai lettori di schermo');
  });

  sum.textContent=ok+' ok, '+ko+' KO'+(ko ? ' · FALLITE: '+fails.join(' ; ') : ' · tutte verdi');
  sum.className=ko ? 'ko' : 'ok';
  document.title=(ko ? 'KO ' : 'OK ')+ok+'/'+(ok+ko)+' prove';
})();
</script>

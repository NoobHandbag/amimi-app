# Gate 1 automatica (audit gate, 2026-09-13/14): i test OFFLINE di amimi-app girano da soli a ogni
# push o PR che tocca le edge function, le migrazioni, i test o il frontend. Nessun segreto, nessuna
# scrittura. E' l'equivalente della Action scoped di Telaio (principio 10: "una guardia che gira solo
# quando una sessione se ne ricorda non e' una guardia"). Node 24 serve al parser TypeScript di tests/edge_syntax.mjs.
#
# Difetto trovato dall'audit del 14-09 sulla prima stesura: `node "$t" | tail -3` con `set -e` e senza
# pipefail restituiva l'exit di tail, cioe' un test rosso restava verde. Ora: `shell: bash` (GitHub
# aggiunge -eo pipefail), nessuna pipe, output intero, exit esplicito.
#
# NOTA per chi pusha: il token gh di NoobHandbag non ha lo scope `workflow`: la prima volta questo
# file si pusha dopo `gh auth refresh -s workflow` (owner), altrimenti GitHub rifiuta il push intero.
# Prova del cancello dopo il primo push: un commit che rompe un'asserzione deve far diventare rosso il run.
name: amimi-app tests

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/snippets/**"
      - "tests/**"
      - "scripts/appsscript-snapshot/**"
      - "scripts/backup-full-check.mjs"
      - "web/src/**"
      # web/public/sw.js e' il service worker delle notifiche, provato da tests/push_sw.mjs (19-10)
      - "web/public/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/e2e/**"
      - "web/playwright.config.ts"
      - "web/scripts/**"
      - ".github/workflows/amimi-app-tests.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/snippets/**"
      - "tests/**"
      - "scripts/appsscript-snapshot/**"
      - "scripts/backup-full-check.mjs"
      - "web/src/**"
      # web/public/sw.js e' il service worker delle notifiche, provato da tests/push_sw.mjs (19-10)
      - "web/public/**"
      - "web/package.json"
      - "web/package-lock.json"
      - "web/e2e/**"
      - "web/playwright.config.ts"
      - "web/scripts/**"
      - ".github/workflows/amimi-app-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Sintassi delle edge function (parser TypeScript di Node 24; node --check e' cieco sui .ts con import, 22-09)
        shell: bash
        run: node tests/edge_syntax.mjs
      - name: loyalty-page generata dalla sorgente (quest audit Premia 2026-09-21, finding T25)
        shell: bash
        run: node supabase/functions/loyalty-page/build.mjs --check
      - name: Suite sul sorgente (cs_*, guardie shopify-sync, letture controllate, colori del tema, materie prime, domini del team, Paillettes, notifiche, comportamento utenti, card Ads e serie mensile Ads)
        shell: bash
        run: |
          set -eo pipefail
          fail=0
          for t in tests/cs_*.mjs tests/shopify_sync_guardie.mjs tests/letture_controllate_guardie.mjs tests/write_api_num.mjs tests/date_roma.mjs tests/write_api_guardie.mjs tests/autopush_decision.mjs tests/loyalty_guardie.mjs tests/ads_sync_guardie.mjs tests/ads_swap_guardie.mjs tests/ads_mensile_guardie.mjs tests/lead_outreach_guardie.mjs tests/arrivo_adesso.mjs tests/snapshot_drive_mensile.mjs tests/ce_compenso_soci.mjs tests/tema_colori_guardie.mjs tests/mat_guardie.mjs tests/dominio_team.mjs tests/villaggio_paillettes.mjs tests/paillettes_guardie.mjs tests/push_core.mjs tests/push_sw.mjs tests/push_eventi_core.mjs tests/beh_guardie.mjs; do
            echo "== $t"
            node "$t" || { echo "::error::suite KO: $t"; fail=1; }
          done
          exit $fail
      - name: Build del frontend (tsc -b + vite) e lint
        shell: bash
        working-directory: web
        # La guardia in vite.config.ts pretende le due VITE_*: qui la chiave PUBBLICA (publishable), la stessa
        # gia' nel repo in tests/features.mjs e uptime.yml e nel bundle live. Nessun segreto.
        env:
          VITE_SUPABASE_URL: https://imszbjeyplaiovylhkgl.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_DP66FFObEGagJknhGOz8xw_8KO8WIgD
        run: |
          set -eo pipefail
          npm ci
          npm run build
          npm run lint
      # Villaggio (18-10, CASI_APERTI n.40 a): DOPO npm ci e la build, perche' la suite prova impasta() sul three.js vero di
      # web/node_modules e controlla che dist/index.html carichi l'ingresso dichiarato da dist/version.json (senza, quelle
      # parti si saltano con una nota e la suite resta verde).
      - name: Suite del Villaggio (catalogo, modello dai dati, cinture sul sorgente, impasta su three.js, version.json)
        shell: bash
        run: node tests/villaggio_catalogo.mjs
      # E2E di Negozi (15-10, rinuncia (a) del gate Fable sul cruscotto B2B, CASI_APERTI n.37): le spec
      # web/e2e/negozi-*.spec.ts girano su dati finti, perche' ogni richiesta a *.supabase.co e' intercettata dalla spec.
      # La build per gli e2e punta a un progetto INESISTENTE (un ref con i trattini non puo' essere reale): una spec
      # nuova che dimentica l'intercettazione fallisce e non arriva alla produzione. assistenza.spec.ts e
      # ingest.spec.ts leggono dal vivo con un login vero: restano fuori.
      # Notifiche (19-10, owner in chat): e2e/notifiche.spec.ts gira qui con le stesse garanzie (intercetta ogni richiesta
      # a *.supabase.co, push-api e' un server finto nella spec) e non ha bisogno di un service worker vero: la config li
      # blocca (serviceWorkers 'block') e dove serve l'iscrizione la spec ne mette uno finto. Nominata SEMPRE col percorso,
      # come le spec del Villaggio: un filtro nudo "notifiche" prenderebbe ogni spec futura col nome simile.
      # Due chiamate, non una (19-10, Gate 2): playwright mette i filtri in OR, quindi con "negozi e2e/notifiche.spec.ts"
      # una spec rinominata o spostata spariva in silenzio e il passo restava verde con l'altra (provato: 33 test, exit 0).
      # Da sola una chiamata che non trova test esce con errore ("No tests found").
      # Comportamento (25-10, modulo beh_*, decisione D6 dell'owner): e2e/comportamento.spec.ts, stesse garanzie (intercetta
      # ogni richiesta a *.supabase.co, la RPC beh_dashboard risponde dati finti), chiamata sua col percorso.
      # Card Ads del Cruscotto (28-10, owner in chat): e2e/ads-swap.spec.ts, stesse garanzie (intercetta ogni richiesta a
      # *.supabase.co, viste v_ads_swap e v_ads_periodo_14g finte, font finti), chiamata sua col percorso.
      - name: Browser per gli e2e (Playwright, solo chromium)
        shell: bash
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: E2E di Negozi, delle Notifiche, di Comportamento e della card Ads su dati finti (build verso un progetto Supabase finto)
        shell: bash
        working-directory: web
        env:
          VITE_SUPABASE_URL: https://e2e-progetto-finto.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_e2e_finto
        run: |
          set -eo pipefail
          npx vite build
          npx playwright test negozi
          npx playwright test e2e/notifiche.spec.ts
          npx playwright test e2e/comportamento.spec.ts
          npx playwright test e2e/ads-swap.spec.ts

  # E2E del Villaggio e delle Paillettes (18-10, CASI_APERTI n.40 a e n.42 a): job a parte, in parallelo a "offline",
  # perche' la scena 3D senza GPU gira col WebGL software (SwiftShader) e le due spec durano un quarto d'ora. Dati finti
  # come Negozi: ogni richiesta a *.supabase.co e' intercettata dalla spec e la build punta a un progetto inesistente.
  # Le spec si nominano SEMPRE col percorso: il filtro nudo "villaggio" prenderebbe ogni spec in una cartella che si
  # chiama villaggio, compresa ingest.spec.ts, che legge e scrive dal vivo con un login.
  e2e-villaggio:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Dipendenze e browser (Playwright, solo chromium)
        shell: bash
        working-directory: web
        run: |
          set -eo pipefail
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E del Villaggio e delle Paillettes su dati finti (build verso un progetto Supabase finto)
        shell: bash
        working-directory: web
        env:
          VITE_SUPABASE_URL: https://e2e-progetto-finto.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_e2e_finto
        # 19-10 (Gate 2): stessa trappola dei filtri in OR del passo e2e di "offline". Qui le due spec restano in una
        # chiamata sola (durano un quarto d'ora e si dividono i worker), ma prima si controlla che esistano tutte e due.
        run: |
          set -eo pipefail
          for f in e2e/villaggio.spec.ts e2e/paillettes.spec.ts; do test -f "$f" || { echo "::error::$f mancante: coi filtri in OR il passo resterebbe verde senza"; exit 1; }; done
          npx vite build
          npx playwright test e2e/villaggio.spec.ts e2e/paillettes.spec.ts

  # Invarianti in SOLA LETTURA sulle viste di produzione con la chiave PUBBLICA (gia' nel bundle
  # e in uptime.yml). Separato e non bloccante: dipende dalla rete e dai 504 di PostgREST
  # (CASI_APERTI n.19), non dal codice.
  invarianti-produzione:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: tests/features.mjs (read-only)
        shell: bash
        run: node tests/features.mjs
      - name: tests/loyalty_smoke.mjs (read-only, App Proxy ed edge Premia)
        shell: bash
        run: node tests/loyalty_smoke.mjs
